<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Copyright (c) 2026 Saurabh Pathak. MIT License. -->
  <title id="t">The leak detector</title>
  <desc id="d">Nine disguises of an example secret word GOBLIN flow into the judge: plain, separated, reversed, leet, base64, hex, ROT13, acrostic and the NATO alphabet. The judge undoes each disguise and reports which one leaked.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9fe8ff"/></marker>
    <style>
      .chip { fill: #1a1424; stroke: #3a2f4b; stroke-width: 2; }
      .m { font: 700 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffcf70; }
      .x { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #efe9f7; }
      .h { font: 700 26px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #efe9f7; }
      .p { font: 400 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #bdb3cc; }
      .ok { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #8ef0a8; }
      .title { font: 700 24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #efe9f7; }
      .wire { fill: none; stroke: #9fe8ff; stroke-width: 2; stroke-dasharray: 6 8; opacity: .8; animation: flow 1.4s linear infinite; }
      .judge { animation: glow 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      @keyframes glow { 0%, 100% { stroke: #2f6b45; } 50% { stroke: #8ef0a8; } }
      @media (prefers-reduced-motion: reduce) { .wire, .judge { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#0f0b16"/>
  <text class="title" x="40" y="44">Nine disguises, one judge (example secret: GOBLIN)</text>

  <g transform="translate(40 70)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">plain</text><text class="x" x="130" y="26">the word is GOBLIN</text>
  </g>
  <g transform="translate(40 116)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">separated</text><text class="x" x="130" y="26">G-O-B-L-I-N</text>
  </g>
  <g transform="translate(40 162)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">reversed</text><text class="x" x="130" y="26">NILBOG</text>
  </g>
  <g transform="translate(40 208)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">leet</text><text class="x" x="130" y="26">G0BL1N</text>
  </g>
  <g transform="translate(40 254)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">base64</text><text class="x" x="130" y="26">R09CTElO</text>
  </g>
  <g transform="translate(40 300)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">hex</text><text class="x" x="130" y="26">47 4f 42 4c 49 4e</text>
  </g>
  <g transform="translate(40 346)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">rot13</text><text class="x" x="130" y="26">TBOYVA</text>
  </g>
  <g transform="translate(40 392)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">acrostic</text><text class="x" x="130" y="26">Graves Owls Bones Lamps Ivy Night</text>
  </g>
  <g transform="translate(40 438)">
    <rect class="chip" width="470" height="40" rx="8"/><text class="m" x="14" y="26">nato</text><text class="x" x="130" y="26">Golf Oscar Bravo Lima India November</text>
  </g>

  <path class="wire" d="M510 90C600 90 600 270 690 270" marker-end="url(#a)"/>
  <path class="wire" d="M510 136C600 136 600 272 690 272"/>
  <path class="wire" d="M510 182C600 182 600 274 690 274"/>
  <path class="wire" d="M510 228C600 228 600 276 690 276"/>
  <path class="wire" d="M510 274H690"/>
  <path class="wire" d="M510 320C600 320 600 278 690 278"/>
  <path class="wire" d="M510 366C600 366 600 280 690 280"/>
  <path class="wire" d="M510 412C600 412 600 282 690 282"/>
  <path class="wire" d="M510 458C600 458 600 284 690 284" marker-end="url(#a)"/>

  <rect class="judge" x="696" y="190" width="460" height="170" rx="14" fill="#16271d" stroke="#2f6b45" stroke-width="3"/>
  <text class="h" x="722" y="234">The judge</text>
  <text class="p" x="722" y="264">Plain TypeScript, not another model.</text>
  <text class="p" x="722" y="288">Undoes every disguise, then looks for the word.</text>
  <text class="ok" x="722" y="330">leaked: true · method: base64</text>
</svg>
