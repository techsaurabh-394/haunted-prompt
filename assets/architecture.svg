<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Copyright (c) 2026 Saurabh Pathak. MIT License. -->
  <title id="t">How The Haunted Prompt works</title>
  <desc id="d">The player types into the web page or CLI. The game engine runs the input filter, sends the prompt to a local open-weight model, runs the output filter, and a deterministic judge decides the result and shows the defense.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ffb454"/>
    </marker>
    <style>
      .box { fill: #1a1424; stroke: #3a2f4b; stroke-width: 2; }
      .hot { fill: #142630; stroke: #24485a; }
      .judge { fill: #16271d; stroke: #2f6b45; }
      .h { font: 700 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #efe9f7; }
      .p { font: 400 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #bdb3cc; }
      .title { font: 700 24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #efe9f7; }
      .flow { fill: none; stroke: #ffb454; stroke-width: 2.5; stroke-dasharray: 8 6; animation: dash 1.2s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="400" fill="#0f0b16"/>
  <text class="title" x="40" y="48">How it works: everything runs on your machine</text>

  <rect class="box" x="40" y="90" width="150" height="90" rx="12"/>
  <text class="h" x="60" y="128">Player</text>
  <text class="p" x="60" y="152">types an attack</text>

  <rect class="box" x="240" y="90" width="170" height="90" rx="12"/>
  <text class="h" x="260" y="128">Web UI or CLI</text>
  <text class="p" x="260" y="152">127.0.0.1 only</text>

  <rect class="box" x="460" y="90" width="200" height="90" rx="12"/>
  <text class="h" x="480" y="128">Game engine</text>
  <text class="p" x="480" y="152">levels, hints, stars</text>

  <rect class="box" x="710" y="90" width="190" height="90" rx="12"/>
  <text class="h" x="730" y="128">Input filter</text>
  <text class="p" x="730" y="152">keyword blocklist</text>

  <rect class="box hot pulse" x="950" y="90" width="210" height="90" rx="12"/>
  <text class="h" x="970" y="128">Ghost</text>
  <text class="p" x="970" y="152">local open-weight model</text>

  <rect class="box" x="950" y="250" width="210" height="90" rx="12"/>
  <text class="h" x="970" y="288">Output filter</text>
  <text class="p" x="970" y="312">censor or tool gate</text>

  <rect class="box judge" x="640" y="250" width="260" height="90" rx="12"/>
  <text class="h" x="660" y="288">Judge (plain code)</text>
  <text class="p" x="660" y="312">9 leak disguises, no AI</text>

  <rect class="box" x="300" y="250" width="290" height="90" rx="12"/>
  <text class="h" x="320" y="288">Result + defense workshop</text>
  <text class="p" x="320" y="312">lesson, defense, the fix</text>

  <path class="flow" d="M190 135H236" marker-end="url(#arrow)"/>
  <path class="flow" d="M410 135H456" marker-end="url(#arrow)"/>
  <path class="flow" d="M660 135H706" marker-end="url(#arrow)"/>
  <path class="flow" d="M900 135H946" marker-end="url(#arrow)"/>
  <path class="flow" d="M1055 180V246" marker-end="url(#arrow)"/>
  <path class="flow" d="M950 295H904" marker-end="url(#arrow)"/>
  <path class="flow" d="M640 295H594" marker-end="url(#arrow)"/>
  <path class="flow" d="M300 295H115V184" marker-end="url(#arrow)"/>
  <text class="p" x="40" y="380">Ollama, llama.cpp, LM Studio or vLLM. No cloud calls, no telemetry. The hosted demo swaps the model for a rule-based ghost.</text>
</svg>
