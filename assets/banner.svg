<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Copyright (c) 2026 Saurabh Pathak. MIT License. -->
  <title id="t">The Haunted Prompt</title>
  <desc id="d">A floating ghost beside the title The Haunted Prompt, with six candles for the six levels.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0f0b16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="70%" r="60%">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.55" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#ff6a2a"/>
    </radialGradient>
    <style>
      .title { font: 700 64px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #efe9f7; }
      .sub { font: 400 24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #bdb3cc; }
      .small { font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #bdb3cc; }
      .ghost { animation: float 4s ease-in-out infinite; }
      .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.4s ease-in-out infinite alternate; }
      .f2 { animation-delay: .2s; } .f3 { animation-delay: .5s; } .f4 { animation-delay: .1s; } .f5 { animation-delay: .7s; } .f6 { animation-delay: .35s; }
      .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes flicker { 0% { transform: scale(1, 1); opacity: 1; } 50% { transform: scale(1.1, .92); opacity: .85; } 100% { transform: scale(.92, 1.08); opacity: 1; } }
      @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
      @media (prefers-reduced-motion: reduce) { .ghost, .flame, .eye { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="300" fill="#0f0b16"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g class="ghost">
    <path d="M150 50c-52 0-84 38-84 92v118l28-20 28 20 28-20 28 20 28-20 28 20V142c0-54-32-92-84-92z" fill="#e9f8ff" opacity="0.93"/>
    <ellipse class="eye" cx="122" cy="140" rx="12" ry="18" fill="#1a1020"/>
    <ellipse class="eye" cx="178" cy="140" rx="12" ry="18" fill="#1a1020"/>
    <ellipse cx="150" cy="190" rx="15" ry="11" fill="#1a1020"/>
  </g>
  <text class="title" x="290" y="130">The Haunted Prompt</text>
  <text class="sub" x="292" y="174">Trick a local open-weight ghost into giving up its secret.</text>
  <text class="sub" x="292" y="206">Then learn the defense that would have stopped you.</text>
  <g transform="translate(292 228)">
    <g><rect x="0" y="18" width="14" height="34" rx="3" fill="#e8dcc2"/><path class="flame" d="M7 0c6 7 7 12 0 18c-7-6-6-11 0-18z" fill="url(#flame)"/></g>
    <g transform="translate(46 0)"><rect x="0" y="18" width="14" height="34" rx="3" fill="#e8dcc2"/><path class="flame f2" d="M7 0c6 7 7 12 0 18c-7-6-6-11 0-18z" fill="url(#flame)"/></g>
    <g transform="translate(92 0)"><rect x="0" y="18" width="14" height="34" rx="3" fill="#e8dcc2"/><path class="flame f3" d="M7 0c6 7 7 12 0 18c-7-6-6-11 0-18z" fill="url(#flame)"/></g>
    <g transform="translate(138 0)"><rect x="0" y="18" width="14" height="34" rx="3" fill="#e8dcc2"/><path class="flame f4" d="M7 0c6 7 7 12 0 18c-7-6-6-11 0-18z" fill="url(#flame)"/></g>
    <g transform="translate(184 0)"><rect x="0" y="18" width="14" height="34" rx="3" fill="#e8dcc2"/><path class="flame f5" d="M7 0c6 7 7 12 0 18c-7-6-6-11 0-18z" fill="url(#flame)"/></g>
    <g transform="translate(230 0)"><rect x="0" y="18" width="14" height="34" rx="3" fill="#e8dcc2"/><path class="flame f6" d="M7 0c6 7 7 12 0 18c-7-6-6-11 0-18z" fill="url(#flame)"/></g>
    <text class="small" x="280" y="42">6 levels · runs offline · any open-weight model · MIT</text>
  </g>
</svg>
