<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Copyright (c) 2026 Saurabh Pathak. MIT License. -->
  <title id="t">The six levels of The Haunted Prompt</title>
  <desc id="d">A ladder of six levels. Each rung adds a defense: none, a keyword filter, an output censor, untrusted-data framing, tools, and a human approval gate. Each defense lights up in turn.</desc>
  <defs>
    <style>
      .rung { fill: #1a1424; stroke: #3a2f4b; stroke-width: 2; }
      .num { font: 700 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1a1020; }
      .name { font: 700 19px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #efe9f7; }
      .def { font: 400 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #bdb3cc; }
      .tag { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #ffcf70; }
      .title { font: 700 24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #efe9f7; }
      .light { animation: light 9s ease-in-out infinite; }
      .l2 { animation-delay: 1.5s; } .l3 { animation-delay: 3s; } .l4 { animation-delay: 4.5s; } .l5 { animation-delay: 6s; } .l6 { animation-delay: 7.5s; }
      @keyframes light { 0%, 20%, 100% { fill: #ffb454; filter: none; } 8% { fill: #8ef0a8; } }
      @media (prefers-reduced-motion: reduce) { .light { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="480" fill="#0f0b16"/>
  <text class="title" x="40" y="34">Six levels, six defenses: each one lights up, each one falls</text>
  <path d="M60 450V80" stroke="#3a2f4b" stroke-width="4"/>

  <g transform="translate(40 402)"><rect class="rung" x="40" y="-28" width="1080" height="56" rx="10"/><circle class="light" cx="20" cy="0" r="18" fill="#ffb454"/><text class="num" x="13" y="8">1</text><text class="name" x="60" y="7">The Chatty Ghost</text><text class="def" x="330" y="7">Defense: none, just an instruction in the prompt</text><text class="tag" x="900" y="7">direct injection</text></g>
  <g transform="translate(40 338)"><rect class="rung" x="40" y="-28" width="1080" height="56" rx="10"/><circle class="light l2" cx="20" cy="0" r="18" fill="#ffb454"/><text class="num" x="13" y="8">2</text><text class="name" x="60" y="7">The Keyword Warden</text><text class="def" x="330" y="7">Defense: a blocklist on what you type</text><text class="tag" x="900" y="7">rephrasing</text></g>
  <g transform="translate(40 274)"><rect class="rung" x="40" y="-28" width="1080" height="56" rx="10"/><circle class="light l3" cx="20" cy="0" r="18" fill="#ffb454"/><text class="num" x="13" y="8">3</text><text class="name" x="60" y="7">The Censor</text><text class="def" x="330" y="7">Defense: an output filter for the plain word</text><text class="tag" x="900" y="7">encoding</text></g>
  <g transform="translate(40 210)"><rect class="rung" x="40" y="-28" width="1080" height="56" rx="10"/><circle class="light l4" cx="20" cy="0" r="18" fill="#ffb454"/><text class="num" x="13" y="8">4</text><text class="name" x="60" y="7">The Letter</text><text class="def" x="330" y="7">Defense: "this text is data", a stronger censor</text><text class="tag" x="900" y="7">indirect injection</text></g>
  <g transform="translate(40 146)"><rect class="rung" x="40" y="-28" width="1080" height="56" rx="10"/><circle class="light l5" cx="20" cy="0" r="18" fill="#ffb454"/><text class="num" x="13" y="8">5</text><text class="name" x="60" y="7">The Crypt Keeper</text><text class="def" x="330" y="7">Defense: "never call open_crypt"</text><text class="tag" x="900" y="7">tool hijack</text></g>
  <g transform="translate(40 82)" ><rect class="rung" x="40" y="-28" width="1080" height="56" rx="10" /><circle class="light l6" cx="20" cy="0" r="18" fill="#ffb454"/><text class="num" x="13" y="8">6</text><text class="name" x="60" y="7">The Gated Crypt</text><text class="def" x="330" y="7">Defense: a human approves dangerous actions</text><text class="tag" x="900" y="7">contained</text></g>
</svg>
